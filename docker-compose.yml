version: '3.8'

services:
  fastmcp:
    build: .
    container_name: leo-mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./keys:/app/keys:ro          # 公钥只读挂载
      - ./data:/var/mcp/data         # 数据目录
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_ISSUER=fastmcp-server
      - MCP_AUDIENCE=mcp-clients
      - MCP_PUBLIC_KEY_PATH=/app/keys/public.pem
      - MCP_BASE_DIR=/var/mcp/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
