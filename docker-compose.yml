version: '3.8'

services:
  fastmcp:
    build: .
    container_name: leo-work-mcp-server
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - ./keys:/app/keys:ro          # 公钥只读挂载
      - ./data:/var/mcp/data         # 数据目录
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9100
      - MCP_ISSUER=leo-work-mcp-server
      - MCP_AUDIENCE=mcp-clients
      - MCP_PUBLIC_KEY_PATH=/app/keys/public.pem
      - MCP_BASE_DIR=/var/mcp/data
      - DB_HOST
      - DB_PORT
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
